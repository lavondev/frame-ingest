[project]
name = "frame-ingest"
version = "0.2.0"
description = "Turn a video (file or URL) into a structured, citable Markdown document. An Agent Skill plus a CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["video", "transcript", "markdown", "agent-skill", "citations"]
authors = [{ name = "lavondev" }]
requires-python = ">=3.11"
# Deliberately small: no web stack, no remote sync and no python-dotenv (.env files are never
# read).
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "imageio-ffmpeg>=0.5",
    "Pillow>=10.3",
    "imagehash>=4.3",
    "openai>=3.24",
    "tenacity>=8.5",
    "httpx>=0.27",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Speech-to-text on this machine for `--profile local`.
local = ["faster-whisper>=1.0"]
# Page URLs (YouTube and similar) through a hardened yt-dlp.
url = ["yt-dlp>=2026.7.4"]

[project.urls]
Homepage = "https://github.com/lavondev/frame-ingest"
Issues = "https://github.com/lavondev/frame-ingest/issues"
Security = "https://github.com/lavondev/frame-ingest/security/policy"

[project.scripts]
frame-ingest = "frame_ingest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frame_ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]

# RUF001-3 allow the typographic characters the document format uses;
# RUF012 is pydantic-style class defaults.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607", "E501", "SIM117", "B017", "RUF007"]
# Eval tooling runs ffmpeg and text-to-speech on our own generated inputs.
"evals/*" = ["S603", "S607"]
# README artwork: the SVG templates are long inline strings.
"scripts/gen_assets.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["imagehash", "imageio_ffmpeg"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
